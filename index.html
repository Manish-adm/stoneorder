<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMROCK Stone — Order Dashboard 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C62828;
    --red-dark: #8E1212;
    --red-light: #EF5350;
    --black: #111111;
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --border: #E0DADA;
    --text: #1A1A1A;
    --muted: #6B6060;
    --green: #2E7D32;
    --orange: #E65100;
    --yellow: #F9A825;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

  /* HEADER */
  .header {
    background:var(--black);
    padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--red);
    position:sticky; top:0; z-index:100;
  }
  .header-brand { display:flex; align-items:center; gap:12px; }
  .header-brand .logo { font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; color:white; letter-spacing:2px; }
  .header-brand .logo span { color:var(--red); }
  .header-brand .sub { font-size:11px; color:#888; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
  .header-right { display:flex; gap:10px; align-items:center; }
  .btn { padding:8px 18px; border:none; border-radius:6px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn-red { background:var(--red); color:white; }
  .btn-red:hover { background:var(--red-dark); }
  .btn-outline { background:transparent; color:white; border:1.5px solid #444; }
  .btn-outline:hover { border-color:var(--red); color:var(--red); }

  /* STATS BAR */
  .stats-bar {
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--border); border-bottom:2px solid var(--border);
  }
  .stat-card {
    background:var(--surface); padding:16px 20px;
    display:flex; flex-direction:column; gap:4px;
  }
  .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:600; }
  .stat-value { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:var(--text); }
  .stat-value.red { color:var(--red); }
  .stat-value.green { color:var(--green); }
  .stat-value.orange { color:var(--orange); }

  /* CONTROLS */
  .controls {
    padding:14px 28px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .search-box {
    flex:1; min-width:200px; padding:8px 14px;
    border:1.5px solid var(--border); border-radius:6px;
    font-family:'DM Sans',sans-serif; font-size:13px; outline:none;
    transition:border .2s;
  }
  .search-box:focus { border-color:var(--red); }
  .filter-select {
    padding:8px 12px; border:1.5px solid var(--border); border-radius:6px;
    font-family:'DM Sans',sans-serif; font-size:13px; outline:none;
    background:white; cursor:pointer;
  }
  .filter-select:focus { border-color:var(--red); }
  .badge { padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .view-toggle { display:flex; border:1.5px solid var(--border); border-radius:6px; overflow:hidden; }
  .view-btn { padding:7px 14px; border:none; background:white; cursor:pointer; font-size:13px; transition:all .2s; }
  .view-btn.active { background:var(--red); color:white; }

  /* MAIN CONTENT */
  .main { padding:20px 28px; }

  /* CARD GRID */
  .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }

  /* ORDER CARD */
  .order-card {
    background:var(--surface); border-radius:10px;
    border:1.5px solid var(--border);
    overflow:hidden; cursor:pointer;
    transition:box-shadow .2s, transform .2s;
  }
  .order-card:hover { box-shadow:0 4px 20px rgba(198,40,40,.12); transform:translateY(-2px); }
  .card-head {
    padding:12px 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg,#fff 0%,#FDF8F8 100%);
  }
  .card-sr { font-family:'Rajdhani',sans-serif; font-size:13px; color:var(--muted); font-weight:600; }
  .card-date { font-size:11px; color:var(--muted); margin-top:2px; }
  .card-client { font-size:15px; font-weight:600; color:var(--text); margin-top:2px; }
  .status-pill {
    padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
  }
  .s-complete { background:#E8F5E9; color:#1B5E20; }
  .s-inprogress { background:#FFF3E0; color:#BF360C; }
  .s-production { background:#E3F2FD; color:#0D47A1; }
  .s-other { background:#F3E5F5; color:#4A148C; }
  .card-body { padding:12px 16px; }
  .card-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .meta-tag { background:#F5F5F5; padding:3px 8px; border-radius:4px; font-size:11px; color:var(--muted); }
  .meta-tag.loc { background:#FFF8E1; color:#795548; }
  .meta-tag.ref { background:#E8EAF6; color:#3949AB; }
  .meta-tag.emp { background:#F3E5F5; color:#7B1FA2; }
  .products-mini { margin-bottom:10px; }
  .product-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px dashed #F0EDED; font-size:12px; }
  .product-row:last-child { border-bottom:none; }
  .product-name { font-weight:500; color:var(--text); flex:1; }
  .product-colour { color:var(--muted); font-size:11px; margin:0 8px; }
  .product-amt { font-weight:600; color:var(--text); }
  .more-products { font-size:11px; color:var(--red); font-weight:600; padding:2px 0; }
  .card-footer {
    padding:10px 16px;
    background:#FAFAFA; border-top:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .payment-info { display:flex; flex-direction:column; gap:2px; }
  .pay-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .pay-total { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; }
  .pay-pending { font-size:11px; font-weight:600; }
  .pending-zero { color:var(--green); }
  .pending-due { color:var(--red); }
  .action-btns { display:flex; gap:6px; }
  .icon-btn {
    width:30px; height:30px; border-radius:6px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    background:white; cursor:pointer; font-size:14px;
    transition:all .2s;
  }
  .icon-btn:hover { border-color:var(--red); background:#FEF0F0; }
  .icon-btn.wa { border-color:#25D366; background:#F0FFF4; }
  .icon-btn.wa:hover { background:#25D366; }

  /* PROGRESS BAR */
  .progress-wrap { margin:8px 0 4px; }
  .progress-label { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:3px; }
  .progress-track { height:4px; background:#EEE; border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--red); border-radius:2px; transition:width .5s; }
  .progress-fill.full { background:var(--green); }

  /* LIST VIEW */
  .order-table { width:100%; border-collapse:collapse; }
  .order-table th {
    background:var(--black); color:white;
    padding:10px 14px; font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; font-weight:600; text-align:left;
    position:sticky; top:61px;
  }
  .order-table td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .order-table tr:hover td { background:#FEF8F8; }
  .order-table .td-sr { font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--red); }
  .order-table .td-client { font-weight:600; }
  .order-table .td-amount { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; }
  .order-table .td-pending-zero { color:var(--green); font-weight:600; }
  .order-table .td-pending-due { color:var(--red); font-weight:600; }

  /* MODAL */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(17,17,17,.65); z-index:200;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background:white; border-radius:12px; width:700px; max-width:95vw;
    max-height:90vh; overflow:hidden; display:flex; flex-direction:column;
    transform:scale(.95); transition:transform .25s;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-overlay.open .modal { transform:scale(1); }
  .modal-header {
    background:var(--black); padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:3px solid var(--red);
  }
  .modal-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:white; }
  .modal-close { background:none; border:none; color:#aaa; font-size:22px; cursor:pointer; padding:0 4px; }
  .modal-close:hover { color:white; }
  .modal-body { overflow-y:auto; padding:20px; }
  .modal-section { margin-bottom:20px; }
  .modal-section-title {
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted); font-weight:700; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .info-item { }
  .info-key { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .info-val { font-size:14px; font-weight:500; margin-top:2px; }
  .product-table { width:100%; border-collapse:collapse; }
  .product-table th { background:#F5F5F5; padding:8px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); text-align:left; }
  .product-table td { padding:8px 12px; font-size:13px; border-bottom:1px solid var(--border); }
  .product-table tfoot td { background:#FEF0F0; font-weight:700; font-size:14px; }
  .payment-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .payment-box { background:#F9F9F9; border-radius:8px; padding:12px; border:1px solid var(--border); }
  .payment-box .val { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; }
  .payment-box.due .val { color:var(--red); }
  .payment-box.paid .val { color:var(--green); }
  .wa-section { background:#F0FFF4; border:1.5px solid #25D366; border-radius:8px; padding:14px; }
  .wa-section h4 { color:#1B5E20; margin-bottom:8px; font-size:13px; }
  .wa-msg { font-size:12px; color:#2E7D32; line-height:1.6; white-space:pre-wrap; background:white; padding:10px; border-radius:6px; margin-bottom:10px; }
  .wa-btn { background:#25D366; color:white; border:none; padding:10px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; width:100%; justify-content:center; }
  .wa-btn:hover { background:#128C7E; }

  /* ADD ORDER MODAL */
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .form-group { display:flex; flex-direction:column; gap:4px; }
  .form-group label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600; }
  .form-input {
    padding:8px 12px; border:1.5px solid var(--border); border-radius:6px;
    font-family:'DM Sans',sans-serif; font-size:13px; outline:none;
  }
  .form-input:focus { border-color:var(--red); }
  .product-entry { background:#F9F9F9; border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; position:relative; }
  .product-entry-title { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; }
  .remove-product { position:absolute; top:10px; right:10px; background:none; border:none; color:#ccc; cursor:pointer; font-size:16px; }
  .remove-product:hover { color:var(--red); }
  .calc-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .calc-total { background:#FEF0F0; padding:8px 12px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--red); text-align:right; }
  .add-product-btn { width:100%; padding:8px; border:2px dashed var(--border); border-radius:6px; background:white; color:var(--muted); cursor:pointer; font-size:13px; margin-bottom:12px; }
  .add-product-btn:hover { border-color:var(--red); color:var(--red); }
  .order-summary-box { background:#FEF0F0; border-radius:8px; padding:14px; margin-bottom:12px; }
  .order-summary-box .row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .order-summary-box .row.total { font-weight:700; font-size:15px; border-top:1px solid #f0c0c0; margin-top:6px; padding-top:6px; }
  .hidden { display:none; }
  .empty-state { text-align:center; padding:60px; color:var(--muted); }
  .empty-state h3 { font-family:'Rajdhani',sans-serif; font-size:22px; margin-bottom:8px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div>
      <div class="logo">AM<span>ROCK</span> STONE</div>
      <div class="sub">Order Management Dashboard — 2026</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-red" onclick="openAddModal()">+ New Order</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="controls">
  <input class="search-box" type="text" placeholder="🔍  Search client, location, product, architect..." id="searchBox" oninput="applyFilters()">
  <select class="filter-select" id="statusFilter" onchange="applyFilters()">
    <option value="">All Status</option>
    <option value="Order Complete">Order Complete</option>
    <option value="Installation in process">Installation</option>
    <option value="Material in Production">In Production</option>
  </select>
  <select class="filter-select" id="empFilter" onchange="applyFilters()">
    <option value="">All Employees</option>
  </select>
  <select class="filter-select" id="pendingFilter" onchange="applyFilters()">
    <option value="">All Payments</option>
    <option value="due">Payment Due</option>
    <option value="clear">Payment Clear</option>
  </select>
  <div class="view-toggle">
    <button class="view-btn active" id="cardViewBtn" onclick="setView('card')">▦ Cards</button>
    <button class="view-btn" id="listViewBtn" onclick="setView('list')">≡ List</button>
  </div>
</div>

<div class="main">
  <div id="cardView" class="card-grid"></div>
  <div id="listView" class="hidden"><table class="order-table" id="orderTable"><thead><tr>
    <th>SR</th><th>Date</th><th>Client</th><th>Location</th><th>Products</th><th>Employee</th><th>Total Amount</th><th>Received</th><th>Pending</th><th>Status</th><th>Action</th>
  </tr></thead><tbody id="tableBody"></tbody></table></div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Order Details</div>
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Add Order Modal -->
<div class="modal-overlay" id="addModal" onclick="closeAddEvent(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Add New Order</div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Client Name *</label><input class="form-input" id="f_client" placeholder="e.g. Rajesh Bhai Patel"></div>
        <div class="form-group"><label>Client Mobile *</label><input class="form-input" id="f_phone" placeholder="9876543210"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Date *</label><input class="form-input" type="date" id="f_date"></div>
        <div class="form-group"><label>Employee *</label>
          <select class="form-input" id="f_employee">
            <option value="Krishna">Krishna</option>
            <option value="Pratham">Pratham</option>
            <option value="Dealer">Dealer</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Architect Name</label><input class="form-input" id="f_arch" placeholder="-"></div>
        <div class="form-group"><label>Architect Mobile</label><input class="form-input" id="f_arch_no" placeholder="-"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Site Address *</label><input class="form-input" id="f_site" placeholder="Flat/Bungalow address"></div>
        <div class="form-group"><label>Location *</label><input class="form-input" id="f_location" placeholder="Area name"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Reference</label><input class="form-input" id="f_ref" placeholder="ShowRoom / Instagram / etc."></div>
        <div class="form-group"><label>Mode of Payment</label>
          <select class="form-input" id="f_payment">
            <option>Cash</option><option>Bank</option><option>Cheque</option>
          </select>
        </div>
      </div>

      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:10px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);">Products</div>
      <div id="productsContainer"></div>
      <button class="add-product-btn" onclick="addProductRow()">+ Add Product / Item</button>

      <div class="order-summary-box" id="orderSummary">
        <div class="row"><span>Sub Total (Products)</span><span id="sumProducts">₹0</span></div>
        <div class="row"><span>Transportation</span><span><input style="width:80px;border:1px solid #ddd;padding:3px 6px;border-radius:4px;font-size:13px;" id="f_transport" value="0" oninput="recalcSummary()"> ₹</span></div>
        <div class="row"><span>GST (18%)</span><input type="checkbox" id="f_gst" onchange="recalcSummary()" style="margin-left:8px;"> <span id="sumGST">₹0</span></div>
        <div class="row total"><span>TOTAL AMOUNT</span><span id="sumTotal" style="color:var(--red);">₹0</span></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>1st Payment Received</label><input class="form-input" type="number" id="f_recv1" value="0" oninput="recalcSummary()"></div>
        <div class="form-group"><label>Order Status</label>
          <select class="form-input" id="f_status">
            <option>Material in Production</option>
            <option>Order Complete</option>
            <option>Installation in process</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label>Order Remarks</label>
        <input class="form-input" id="f_remarks" placeholder="Any notes...">
      </div>
      <button class="btn btn-red" style="width:100%;padding:12px;" onclick="submitNewOrder()">✓ Save Order</button>
    </div>
  </div>
</div>

let allOrders = JSON.parse(JSON.stringify(ORDERS_RAW));
let filtered = [...allOrders];
let currentView = 'card';

// ── INIT
window.onload = () => {
  document.getElementById('f_date').value = new Date().toISOString().split('T')[0];
  populateEmployeeFilter();
  renderStats();
  renderCards();
  addProductRow();
};

function populateEmployeeFilter() {
  const emps = [...new Set(allOrders.map(o=>o.employee))].filter(Boolean);
  const sel = document.getElementById('empFilter');
  emps.forEach(e => { const o=document.createElement('option'); o.value=e; o.textContent=e; sel.appendChild(o); });
}

// ── STATS
function fmt(n) { return '₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function renderStats() {
  const total = allOrders.reduce((a,o)=>a+o.total_amount,0);
  const received = allOrders.reduce((a,o)=>a+o.total_received,0);
  const pendingAmt = allOrders.filter(o=>o.pending<0).reduce((a,o)=>a+Math.abs(o.pending),0);
  const dueOrders = allOrders.filter(o=>o.pending<0).length;
  const complete = allOrders.filter(o=>o.order_remarks==='Order Complete').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${allOrders.length}</div></div>
    <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value">${fmt(total)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Collected</div><div class="stat-value green">${fmt(received)}</div></div>
    <div class="stat-card"><div class="stat-label">Pending Amount</div><div class="stat-value red">${fmt(pendingAmt)}<span style="font-size:12px;color:var(--muted);"> (${dueOrders} orders)</span></div></div>
    <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value orange">${complete} / ${allOrders.length}</div></div>
  `;
}

// ── FILTERS
function applyFilters() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const emp = document.getElementById('empFilter').value;
  const pay = document.getElementById('pendingFilter').value;
  filtered = allOrders.filter(o => {
    const haystack = [o.client,o.location,o.site,o.architect,o.reference,o.employee,...o.products.map(p=>p.product+' '+p.colour)].join(' ').toLowerCase();
    if(q && !haystack.includes(q)) return false;
    if(st && o.order_remarks!==st) return false;
    if(emp && o.employee!==emp) return false;
    if(pay==='due' && o.pending>=0) return false;
    if(pay==='clear' && o.pending<0) return false;
    return true;
  });
  if(currentView==='card') renderCards(); else renderTable();
}

function setView(v) {
  currentView=v;
  document.getElementById('cardViewBtn').className='view-btn'+(v==='card'?' active':'');
  document.getElementById('listViewBtn').className='view-btn'+(v==='list'?' active':'');
  document.getElementById('cardView').className='card-grid'+(v==='card'?'':' hidden');
  document.getElementById('listView').className=(v==='list'?'':'hidden');
  if(v==='card') renderCards(); else renderTable();
}

// ── STATUS PILL
function statusPill(r) {
  if(!r) return `<span class="status-pill s-other">—</span>`;
  if(r.includes('Complete')) return `<span class="status-pill s-complete">✓ Complete</span>`;
  if(r.includes('Installation')) return `<span class="status-pill s-inprogress">🔧 Installing</span>`;
  if(r.includes('Production')) return `<span class="status-pill s-production">⚙ Production</span>`;
  return `<span class="status-pill s-other">${r.substring(0,16)}</span>`;
}

// ── CARD RENDER
function renderCards() {
  const cv = document.getElementById('cardView');
  if(!filtered.length) { cv.innerHTML='<div class="empty-state"><h3>No Orders Found</h3><p>Try changing your search or filters.</p></div>'; return; }
  cv.innerHTML = filtered.map(o => {
    const pendingAbs = Math.abs(o.pending);
    const pct = o.total_amount>0 ? Math.min(100,Math.round(o.total_received/o.total_amount*100)) : 100;
    const pendingClass = o.pending<-10 ? 'pending-due' : 'pending-zero';
    const pendingText = o.pending<-10 ? `₹${pendingAbs.toLocaleString('en-IN',{maximumFractionDigits:0})} Due` : '✓ Clear';
    const productsShow = o.products.slice(0,2);
    const moreCount = o.products.length - 2;
    return `<div class="order-card" onclick="openDetail(${o.sr})">
      <div class="card-head">
        <div>
          <div class="card-sr">SR #${o.sr} &nbsp;·&nbsp; <span style="color:var(--text)">${o.employee}</span></div>
          <div class="card-client">${o.client}</div>
          <div class="card-date">${o.date}</div>
        </div>
        ${statusPill(o.order_remarks)}
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="meta-tag loc">📍 ${o.location}</span>
          <span class="meta-tag ref">↗ ${o.reference}</span>
          <span class="meta-tag">${o.payment_mode}</span>
        </div>
        <div class="products-mini">
          ${productsShow.map(p=>`<div class="product-row">
            <span class="product-name">${p.product}</span>
            <span class="product-colour">${p.colour||'—'}</span>
            <span class="product-amt">₹${p.total.toLocaleString('en-IN',{maximumFractionDigits:0})}</span>
          </div>`).join('')}
          ${moreCount>0?`<div class="more-products">+${moreCount} more product${moreCount>1?'s':''}</div>`:''}
        </div>
        <div class="progress-wrap">
          <div class="progress-label"><span>Payment</span><span>${pct}%</span></div>
          <div class="progress-track"><div class="progress-fill${pct>=100?' full':''}" style="width:${pct}%"></div></div>
        </div>
      </div>
      <div class="card-footer">
        <div class="payment-info">
          <div class="pay-label">Total Amount</div>
          <div class="pay-total">₹${o.total_amount.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
          <div class="pay-pending ${pendingClass}">${pendingText}</div>
        </div>
        <div class="action-btns">
          ${o.phone&&o.phone!=='-'?`<button class="icon-btn wa" onclick="event.stopPropagation();sendWhatsApp(${o.sr})" title="Send WhatsApp Update">💬</button>`:''}
          <button class="icon-btn" onclick="event.stopPropagation();openDetail(${o.sr})" title="View Details">👁</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── WHATSAPP (FREE - wa.me link)
function buildWAMessage(o) {
  const pending = o.pending<-10 ? `\n💰 *Pending Amount: ₹${Math.abs(o.pending).toLocaleString('en-IN',{maximumFractionDigits:0})}* — Kindly arrange payment at your earliest.` : `\n✅ Payment is fully clear. Thank you!`;
  const products = o.products.map(p=>`  • ${p.product}${p.colour?' ('+p.colour+')':''} — ${p.sqft} sq.ft`).join('\n');
  return `Namaste ${o.client} Ji 🙏\n\nThis is AMROCK Stone — your order update:\n\n*Order SR #${o.sr}*\n📍 Site: ${o.location}\n📅 Date: ${o.date}\n\n*Products:*\n${products}\n\n*Order Total: ₹${o.total_amount.toLocaleString('en-IN',{maximumFractionDigits:0})}*${pending}\n\nFor any queries, please contact us.\n\n— AMROCK Stone Team\n📞 +91 98258 03854`;
}
function sendWhatsApp(sr) {
  const o = allOrders.find(x=>x.sr===sr);
  if(!o||!o.phone||o.phone==='-') return;
  const msg = buildWAMessage(o);
  window.open(`https://wa.me/91${o.phone}?text=${encodeURIComponent(msg)}`,'_blank');
}
function sendWhatsAppDirect(phone,msg) {
  window.open(`https://wa.me/91${phone}?text=${decodeURIComponent(msg)}`,'_blank');
}

let productCount=0;

function addProductRow() {
  productCount++;
  const id = productCount;
  const div = document.createElement('div');
  div.className='product-entry'; div.id=`pe_${id}`;
  div.innerHTML=`<button class="remove-product" onclick="removeProduct(${id})">✕</button>
    <div class="product-entry-title">Product ${id}</div>
    <div class="form-row" style="margin-bottom:8px">
      <div class="form-group"><label>Product Name *</label><input class="form-input" id="pp_${id}" placeholder="e.g. Arctic Stone" oninput="recalcSummary()"></div>
      <div class="form-group"><label>Colour</label><input class="form-input" id="pc_${id}" placeholder="e.g. Exclusive White"></div>
    </div>
    <div class="calc-row">
      <div class="form-group"><label>Sq.Ft *</label><input class="form-input" type="number" id="psf_${id}" value="0" oninput="recalcRow(${id})"></div>
      <div class="form-group"><label>Rate/sqft (₹) *</label><input class="form-input" type="number" id="prt_${id}" value="0" oninput="recalcRow(${id})"></div>
      <div class="form-group"><label>Amount</label><div class="calc-total" id="ptotal_${id}">₹0</div></div>
    </div>`;
  document.getElementById('productsContainer').appendChild(div);
  recalcSummary();
}
function removeProduct(id) {
  const el = document.getElementById(`pe_${id}`);
  if(el) el.remove();
  recalcSummary();
}
function recalcRow(id) {
  const sf = parseFloat(document.getElementById(`psf_${id}`)?.value)||0;
  const rt = parseFloat(document.getElementById(`prt_${id}`)?.value)||0;
  const t = sf*rt;
  const el = document.getElementById(`ptotal_${id}`);
  if(el) el.textContent='₹'+t.toLocaleString('en-IN',{maximumFractionDigits:0});
  recalcSummary();
}
function recalcSummary() {
  let sub=0;
  document.querySelectorAll('[id^="psf_"]').forEach(el=>{
    const id=el.id.replace('psf_','');
    const sf=parseFloat(el.value)||0;
    const rt=parseFloat(document.getElementById(`prt_${id}`)?.value)||0;
    sub+=sf*rt;
  });
  const transport=parseFloat(document.getElementById('f_transport')?.value)||0;
  const gst=document.getElementById('f_gst')?.checked ? sub*0.18 : 0;
  const total=sub+transport+gst;
  document.getElementById('sumProducts').textContent='₹'+sub.toLocaleString('en-IN',{maximumFractionDigits:0});
  document.getElementById('sumGST').textContent='₹'+gst.toLocaleString('en-IN',{maximumFractionDigits:0});
  document.getElementById('sumTotal').textContent='₹'+total.toLocaleString('en-IN',{maximumFractionDigits:0});
}

  const products=[];
  let sub=0;
  document.querySelectorAll('[id^="psf_"]').forEach(el=>{
    const id=el.id.replace('psf_','');
    const name=document.getElementById(`pp_${id}`)?.value.trim();
    if(!name) return;
    const sf=parseFloat(el.value)||0;
    const rt=parseFloat(document.getElementById(`prt_${id}`)?.value)||0;
    const t=sf*rt; sub+=t;
    products.push({product:name,colour:document.getElementById(`pc_${id}`)?.value.trim()||'',sqft:sf,price:rt,total:t});
  });
  if(!products.length){alert('Add at least one product');return;}
  const transport=parseFloat(document.getElementById('f_transport').value)||0;
  const gst=document.getElementById('f_gst').checked?sub*0.18:0;
  const total=sub+transport+gst;
  const recv1=parseFloat(document.getElementById('f_recv1').value)||0;
  const newSR=Math.max(...allOrders.map(o=>o.sr))+1;
  const newOrder={sr:newSR,date,client,phone,architect:document.getElementById('f_arch').value||'-',employee:document.getElementById('f_employee').value,location:document.getElementById('f_location').value,site:document.getElementById('f_site').value,payment_mode:document.getElementById('f_payment').value,total_amount:total,total_received:recv1,pending:-(total-recv1),dispatch_date:'',install_date:'',order_remarks:document.getElementById('f_status').value,reference:document.getElementById('f_ref').value||'Direct',products};
  allOrders.unshift(newOrder);
  filtered=[...allOrders];
  renderStats();
  if(currentView==='card') renderCards(); else renderTable();
  closeAddModal();
  // Reset form
  document.getElementById('f_client').value='';document.getElementById('f_phone').value='';
  document.getElementById('productsContainer').innerHTML='';productCount=0;
  addProductRow();
  alert(`✅ Order #${newSR} for ${client} added successfully!\n\n💡 NEXT: Copy this data to your Google Sheet using the template below.`);
}

// ── EXPORT CSV
function exportCSV() {
  const rows=[['SR','Date','Client','Phone','Architect','Employee','Location','Site','Products','Mode','Total Amount','Received','Pending','Status','Reference']];
  allOrders.forEach(o=>{
    rows.push([o.sr,o.date,o.client,o.phone,o.architect,o.employee,o.location,'"'+o.site+'"','"'+o.products.map(p=>p.product+' '+p.colour).join(' | ')+'"',o.payment_mode,o.total_amount,o.total_received,Math.abs(o.pending),o.order_remarks,o.reference]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='AMROCK_Orders_2026.csv';
  a.click();
}
